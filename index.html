<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="Private offline multi-employer attendance tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>MyWorkLog</title>
<style>
:root{--blue:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#748096;--line:#e5e9f0;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:17px 18px 15px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:850}.tag{font-size:12px;color:var(--muted);margin-top:2px}.lock{border:0;background:#eef3ff;border-radius:13px;width:45px;height:45px;font-size:20px}
main{max-width:720px;margin:auto;padding:18px 15px 105px}.hero{border-radius:24px;padding:22px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 12px 28px #2563eb26;margin-bottom:14px}.hero h1{margin:0;font-size:25px}.hero p{margin:5px 0 0;opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #17203308}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{margin:0}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:4px}
.title{font-weight:800;font-size:17px;margin:22px 2px 9px}.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.soft{background:#edf2f8;color:#27344a}.full{width:100%}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.muted{color:var(--muted);font-size:13px}.working{border:2px solid #60a5fa}.timer{font-size:34px;font-weight:900;margin:12px 0}.badge{display:inline-block;border-radius:99px;background:#e8f0ff;color:var(--blue);font-size:11px;font-weight:850;padding:5px 9px}
.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 5px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px #1720330a}.nav{flex:1;border:0;background:none;color:#7b8495;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:21px}.nav span{font-size:10px}.nav.active{color:var(--blue);font-weight:800}
.list{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid #edf0f5}.list:last-child{border-bottom:0}
label{display:block;font-size:12px;font-weight:800;color:#667187;margin:12px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dde7;border-radius:11px;background:#fff;color:var(--text)}textarea{min-height:80px}
.sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end}.sheetbox{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.sheet.hidden{display:none}
.empty{text-align:center;color:var(--muted);padding:28px 8px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #edf0f5;white-space:nowrap}.toast{position:fixed;z-index:50;left:50%;bottom:92px;transform:translate(-50%,20px);background:#172033;color:#fff;padding:10px 14px;border-radius:11px;font-size:13px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){main{padding-bottom:100px}.bottom{max-width:720px;left:50%;right:auto;width:720px;transform:translateX(-50%);border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<header class="top"><div><div class="logo">MyWorkLog</div><div class="tag">Private • Offline • Local</div></div><button class="lock" id="lock">🔒</button></header>
<main id="app"></main>
<nav class="bottom">
<button class="nav active" data-p="home">⌂<span>Home</span></button>
<button class="nav" data-p="employers">▣<span>Employers</span></button>
<button class="nav" data-p="attendance">◷<span>Attendance</span></button>
<button class="nav" data-p="reports">▤<span>Reports</span></button>
<button class="nav" data-p="settings">⚙<span>Settings</span></button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheetbox" id="sheetbox"></div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body></html>
